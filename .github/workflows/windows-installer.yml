name: Build Windows Offline Portable
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v0.4.0']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt
      - name: Test UI, progress, model discovery and SRT editing
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build standalone app
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir --name Dubtitler
          --collect-all faster_whisper --collect-all ctranslate2
          --collect-all tokenizers --collect-all onnxruntime
          --collect-all sherpa_onnx main.py
      - name: Bundle pinned offline English model and instructions
        run: |
          python scripts/bundle_model.py dist/Dubtitler
          python scripts/bundle_speakers.py dist/Dubtitler
          python scripts/collect_licenses.py dist/Dubtitler
          Copy-Item README.md dist/Dubtitler/README.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/Dubtitler/THIRD_PARTY_NOTICES.md
      - name: Package portable ZIP
        run: Compress-Archive -Path dist/Dubtitler -DestinationPath Dubtitler-v0.4.0-Windows-Offline-Portable.zip
      - name: Test extracted portable offline with empty caches
        shell: pwsh
        run: |
          Expand-Archive Dubtitler-v0.4.0-Windows-Offline-Portable.zip -DestinationPath portable-check
          $env:HF_HOME = "$env:RUNNER_TEMP/dubtitler-empty-hf"
          $env:DUBTITLER_MODEL_CACHE = "$env:RUNNER_TEMP/dubtitler-empty-cache"
          $env:HF_HUB_OFFLINE = '1'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $result = Join-Path $PWD 'portable-smoke.json'
          $process = Start-Process -FilePath 'portable-check/Dubtitler/Dubtitler.exe' -ArgumentList '--smoke-test', "`"$result`"" -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            throw 'Portable smoke test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Portable smoke test failed: $($process.ExitCode)" }
          if (-not (Test-Path $result)) { throw 'Portable smoke test did not write a result' }
          Get-Content $result
          if (-not (Get-Content $result -Raw | ConvertFrom-Json).ok) { throw 'Portable smoke test failed' }
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dubtitler-v0.4.0-Windows-Offline-Portable
          path: Dubtitler-v0.4.0-Windows-Offline-Portable.zip
          if-no-files-found: error
      - name: Upload validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-smoke-result
          path: portable-smoke.json
          if-no-files-found: warn
  release:
    if: github.ref == 'refs/tags/v0.4.0'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Dubtitler-v0.4.0-Windows-Offline-Portable
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          body: |
            Download the Windows Offline Portable ZIP, extract the whole folder, and run Dubtitler.exe.
            Includes Base English and offline neural speaker models. No Python, model download, account, or installation required.
            Other transcription models require a one-time download. No installer variant is published for v0.4.
          files: release/*.zip
          fail_on_unmatched_files: true
