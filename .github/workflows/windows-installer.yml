name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'requirements.txt'
      - 'installer/**'
      - '.github/workflows/windows-installer.yml'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build standalone app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name Dubtitler --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers main.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Create installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\Dubtitler.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: Dubtitler-Windows-Installer
          path: installer/output/Dubtitler-Setup.exe
          if-no-files-found: error
